<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="tinatGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e6fffa" />
    </linearGradient>
    <linearGradient id="pulseGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Base -->
  <rect width="512" height="512" rx="120" fill="url(#tinatGradient)" />
  <rect x="20" y="20" width="472" height="472" rx="104" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.2" />

  <!-- Top Horizontal Crossbar of "T" -->
  <rect x="96" y="116" width="320" height="68" rx="34" fill="url(#accentGradient)" />

  <!-- Vertical Stem of "T" -->
  <rect x="222" y="116" width="68" height="280" rx="34" fill="url(#accentGradient)" />

  <!-- Health Research Pulse Wave -->
  <path
    d="M 120 256
       L 190 256
       L 220 200
       L 256 312
       L 292 220
       L 322 256
       L 392 256"
    fill="none"
    stroke="url(#pulseGradient)"
    stroke-width="26"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <circle cx="256" cy="312" r="14" fill="#ffffff" stroke="#0284c7" stroke-width="5" />
  <circle cx="220" cy="200" r="10" fill="#ffffff" />
  <circle cx="292" cy="220" r="10" fill="#ffffff" />
</svg>
